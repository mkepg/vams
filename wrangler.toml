# Cloudflare Pages: the site's build output, the store behind shared scene links, and the
# Lab's runtime (its main module, its compiler and the headers the compiler reads).
# This file is the project's configuration source; the dashboard shows these fields read-only.
name = "vams"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-12"

[[kv_namespaces]]
binding = "SHARES"
id = "7d85439fec8247699fb6cbef54207f94"

[[kv_namespaces]]
binding = "LAB_RUNTIME"
id = "03554bbf6ea4458bba35732e7e1f43db"
