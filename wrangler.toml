# Cloudflare Pages: the site's build output and the store behind shared scene links.
# This file is the project's configuration source; the dashboard shows these fields read-only.
name = "vams"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-12"

[[kv_namespaces]]
binding = "SHARES"
id = "7d85439fec8247699fb6cbef54207f94"

[[kv_namespaces]]
binding = "LAB_RUNTIME"
id = "03554bbf6ea4458bba35732e7e1f43db"

[vars]
# Filled in when the compile service is deployed. While empty, /api/compile answers offline.
# The secret LAB_COMPILE_SECRET is set with `wrangler pages secret put`, never in this file.
LAB_COMPILE_URL = ""
