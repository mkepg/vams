<!doctype html>
<html lang="en">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
   <meta name="theme-color" content="#1d2b4f" />
   <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
   <title>VAMS</title>
   <script>
     (function () {
       var root = document.documentElement;
       try {
         root.dataset.theme = localStorage.getItem('vams-theme') === 'blueprint' ? 'blueprint' : 'vellum';
       } catch (e) {
         root.dataset.theme = 'vellum';
       }
       if (/^\/app\/?$/.test(location.pathname)) root.classList.add('route-editor');
       if (location.pathname === '/' && new URLSearchParams(location.search).has('stage')) root.classList.add('stage');
     })();
   </script>
 </head>
 <body>
   <div id="root"></div>
   <script prerender type="module" src="/src/app/main.tsx"></script>
 </body>
</html>
