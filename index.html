<!doctype html>
<html lang="en">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
   <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
   <meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)" />
   <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
   <link rel="preload" href="/fonts/Minecrafter.ttf" as="font" type="font/ttf" crossorigin />
   <title>VAMS</title>
   <script>
     (function () {
       var root = document.documentElement;
       var theme = null;
       try {
         var stored = localStorage.getItem('vams-theme');
         var legacy = stored === 'blueprint' ? 'dark' : stored === 'vellum' ? 'light' : null;
         if (legacy) localStorage.setItem('vams-theme', (stored = legacy));
         if (stored === 'dark' || stored === 'light') theme = stored;
       } catch (e) {}
       if (!theme) {
         try {
           theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
         } catch (e) {
           theme = 'light';
         }
       }
       root.dataset.theme = theme;
       if (/^\/app\/?$/.test(location.pathname)) root.classList.add('route-editor');
       if (location.pathname === '/' && new URLSearchParams(location.search).has('stage')) root.classList.add('stage');
     })();
   </script>
 </head>
 <body>
   <div id="root"></div>
   <script prerender type="module" src="/src/app/main.tsx"></script>
 </body>
</html>
